name: nexplay

services:

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      livekit:
        condition: service_healthy
      music-bot:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      WEB_ORIGIN: "https://${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}"
      COOKIE_SECURE: "true"
      INVITE_TOKEN: "${INVITE_TOKEN:?Defina INVITE_TOKEN no arquivo .env}"
      ADMIN_USERNAMES: "${ADMIN_USERNAMES:-}"
      OPEN_REGISTRATION: "${OPEN_REGISTRATION:-false}"
      MAX_SERVERS_PER_USER: "${MAX_SERVERS_PER_USER:-5}"
      SESSION_SECRET: "${SESSION_SECRET:?Defina SESSION_SECRET no arquivo .env}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY no arquivo .env}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET no arquivo .env}"
      LIVEKIT_PUBLIC_URL: "wss://${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}/livekit"
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      MUSIC_BOT_INTERNAL_URL: http://music-bot:4100
      DB_PATH: /app/data/nexplay.db
      VOICE_CHANNELS: "${VOICE_CHANNELS:-geral:Geral:Conversa livre,jogos:Jogos:Partidas e squads,afk:AFK:Pausa rápida}"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no arquivo .env}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no arquivo .env}"
      MINIO_BUCKET: sausixudos-attachments
      KYC_VENDOR: "${KYC_VENDOR:-none}"
      KYC_API_KEY: "${KYC_API_KEY:-}"
      KYC_API_BASE_URL: "${KYC_API_BASE_URL:-}"
      KYC_WEBHOOK_SECRET: "${KYC_WEBHOOK_SECRET:-}"
      IDENTITY_VERIFICATION_REQUIRED: "${IDENTITY_VERIFICATION_REQUIRED:-false}"
    volumes:
      - api_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s

  # Storage de objetos pra anexos de mensagem (imagem/arquivo) — self-hosted,
  # sem exposição de porta pra internet (só acessível pelo container `api`
  # pela rede interna do compose). Sem healthcheck próprio: a imagem oficial
  # não traz utilitário HTTP (curl/wget/node) pra checar; a API já tolera o
  # MinIO estar indisponível no boot (retry com backoff em storage.ts) e
  # reporta erro por requisição em vez de derrubar o processo inteiro.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no arquivo .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no arquivo .env}"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}"
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  music-bot:
    build:
      context: .
      dockerfile: apps/music-bot/Dockerfile
    depends_on:
      livekit:
        condition: service_healthy
      pot-provider:
        condition: service_healthy
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY no arquivo .env}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET no arquivo .env}"
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      YTDLP_PLUGIN_DIR: /app/.tools/yt-dlp-plugins
      YTDLP_POT_BASE_URL: http://pot-provider:4416
      YTDLP_COOKIES_PATH: "${YTDLP_COOKIES_PATH:-}"
      YTDLP_PROXY_URL: "${YTDLP_PROXY_URL:-}"
      MUSIC_DJ_USER_IDS: "${MUSIC_DJ_USER_IDS:-}"
    volumes:
      - ./secrets:/run/music-secrets:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s


  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:4416/').then(r=>process.exit(r.status>=500?1:0)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  livekit:
    image: livekit/livekit-server:v1.13.5
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET}"
      # webhook.api_key não pode ficar num arquivo estático versionado (não dá
      # pra fazer ${LIVEKIT_API_KEY} ser substituído dentro de um YAML montado
      # como volume) — LIVEKIT_CONFIG é o jeito suportado pelo próprio
      # binário (--config-body) de passar a config inteira via env var, onde
      # a substituição do compose funciona normalmente. Ver infra/livekit.yaml
      # pra reaproveitar o restante da config caso isso precise virar arquivo de novo.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        room:
          auto_create: true
          empty_timeout: 300
          departure_timeout: 20
          # Teto global por sala (independente do limite por canal já aplicado
          # na API): rede de segurança contra um canal com userLimit=0 (o
          # padrão, sem limite) lotar e derrubar a VPS de 2 vCPU.
          max_participants: 60
        webhook:
          api_key: "${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY}"
          urls:
            - http://api:3000/api/livekit/webhook
    ports:
      - '0.0.0.0:7881:7881/tcp'
      - '0.0.0.0:7882:7882/udp'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    healthcheck:
      test: [ "CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:7880/ 2>&1 | grep -q 'HTTP/'" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  # Nomes físicos fixados nos volumes já existentes em produção (criados sob
  # o antigo nome de projeto Compose "sausixudos"). Sem isso, renomear o
  # projeto pra "nexplay" faria o Compose procurar volumes novos e vazios
  # (nexplay_caddy_data etc.) na próxima subida, dando a impressão de que
  # todo o histórico/anexos/certificado TLS sumiram — o dado continua exatamente
  # onde está, só o nome dos containers muda pra nexplay-*.
  caddy_data:
    name: sausixudos_caddy_data
  caddy_config:
    name: sausixudos_caddy_config
  api_data:
    name: sausixudos_api_data
  minio_data:
    name: sausixudos_minio_data
