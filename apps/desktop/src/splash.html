<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>NexPlay</title>
  <style>
    :root { --cyan: #2ee6f0; --blue: #1f6bff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #0d1c3f 0%, #08112a 46%, #050915 100%);
      color: #dfe9ff; font-family: 'Segoe UI', system-ui, sans-serif;
      -webkit-app-region: drag; user-select: none; cursor: default;
      border: 1px solid #16264d;
      transition: opacity 220ms ease;
    }
    body.leaving { opacity: 0; }

    /* Cena da logo: halo, dois anéis de luz que orbitam e a logo respirando com um brilho que a atravessa */
    .stage { position: relative; width: 220px; height: 220px; animation: enter 620ms cubic-bezier(.16, 1, .3, 1) both; }
    .halo {
      position: absolute; inset: 14px; border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 230, 240, .34) 0%, rgba(31, 107, 255, .2) 45%, transparent 70%);
      filter: blur(14px); animation: halo 2.6s ease-in-out infinite;
    }
    .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ring-outer { animation: spin 1.7s linear infinite; }
    .ring-inner { animation: spin-back 3.1s linear infinite; }
    .arc-outer { stroke-dasharray: 150 430; }
    .arc-inner { stroke-dasharray: 70 400; }
    .spark { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
    .spark::after {
      content: ''; position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%;
      background: #b6f7ff; box-shadow: 0 0 10px 2px rgba(46, 230, 240, .85);
    }
    .spark.a { animation: spin 2.3s linear infinite; }
    .spark.a::after { transform: translateY(-104px); }
    .spark.b { animation: spin-back 3.6s linear infinite; }
    .spark.b::after { transform: translateY(-92px); width: 5px; height: 5px; opacity: .8; }
    .spark.c { animation: spin 5.2s linear infinite; animation-delay: -1.4s; }
    .spark.c::after { transform: translateY(-100px); width: 4px; height: 4px; opacity: .65; }

    .logo-wrap {
      position: absolute; left: 50%; top: 50%; width: 138px; height: 138px; margin: -69px 0 0 -69px;
      border-radius: 25%; overflow: hidden; animation: breathe 2.6s ease-in-out infinite;
      box-shadow: 0 0 34px rgba(31, 107, 255, .55);
    }
    .logo-wrap img { display: block; width: 100%; height: 100%; }
    .logo-wrap::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .42) 50%, transparent 62%);
      transform: translateX(-130%); animation: shine 2.7s ease-in-out infinite;
    }

    .brand { margin-top: 26px; font-size: 22px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; animation: rise 700ms 200ms cubic-bezier(.16, 1, .3, 1) both; }
    .brand b { font-weight: 600; background: linear-gradient(90deg, var(--cyan), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .status { margin-top: 12px; min-height: 18px; font-size: 12px; color: #8fa6d6; letter-spacing: .04em; animation: rise 700ms 320ms cubic-bezier(.16, 1, .3, 1) both; }
    .status i { display: inline-block; width: 3px; height: 3px; margin-left: 3px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
    .status i:nth-child(2) { animation-delay: .2s; }
    .status i:nth-child(3) { animation-delay: .4s; }
    .version { position: absolute; bottom: 14px; font-size: 10px; color: #4b5d86; letter-spacing: .06em; }

    @keyframes enter { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-back { to { transform: rotate(-360deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    @keyframes halo { 0%, 100% { opacity: .65; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes shine { 0%, 45% { transform: translateX(-130%); } 80%, 100% { transform: translateX(130%); } }
    @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="halo"></div>
    <svg class="ring ring-outer" viewBox="0 0 220 220">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6f0" /><stop offset="1" stop-color="#1f6bff" /></linearGradient>
        <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f6bff" stop-opacity=".9" /><stop offset="1" stop-color="#2ee6f0" stop-opacity=".2" /></linearGradient>
      </defs>
      <circle class="arc-outer" cx="110" cy="110" r="102" fill="none" stroke="url(#g1)" stroke-width="3" stroke-linecap="round" />
    </svg>
    <svg class="ring ring-inner" viewBox="0 0 220 220">
      <circle class="arc-inner" cx="110" cy="110" r="90" fill="none" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" />
    </svg>
    <span class="spark a"></span><span class="spark b"></span><span class="spark c"></span>
    <div class="logo-wrap"><img src="splash-logo.png" alt="" width="138" height="138" /></div>
  </div>
  <div class="brand"><b>Nex</b>Play</div>
  <div class="status"><span id="status">Iniciando</span><i></i><i></i><i></i></div>
  <div class="version" id="version"></div>
  <script>
    // O processo principal troca o texto conforme o app avança (window.__setStatus) e, quando a
    // janela principal está pronta, marca "leaving" para a tela sumir suavemente.
    var statusEl = document.getElementById("status");
    window.__setStatus = function (text) { statusEl.textContent = String(text); };
    var version = new URLSearchParams(location.search).get('v');
    if (version) document.getElementById('version').textContent = 'v' + version;
  </script>
</body>
</html>
